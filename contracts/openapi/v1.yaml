openapi: 3.1.0
info:
  title: Frontal API
  version: 0.0.0
paths:
  /v1/health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: The optional API process is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
components:
  schemas:
    Health:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ok
